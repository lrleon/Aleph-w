# REUSE 3.x bulk-annotation file.
#
# Aleph-w is licensed MIT, but for the third-party code declared with the
# overrides below. Rather than inject an SPDX header into ~1000 source files,
# this file declares licensing in bulk (the REUSE spec's supported
# mechanism). The bundled third-party `miniz` carries its own copyright
# holders but is also MIT; gmpfrxx (`gmpfrxx.h`, `gmpfrxx.C`, `mpfr_mul_d.h`
# and `mpfr_mul_d.c`) is LGPL-3.0-or-later, and `ran_array.c` and
# `ran_array.h`, Knuth's generator, are under his notice (see
# THIRD_PARTY_NOTICES.md).
#
# Verified by the `reuse-lint` CI job (.github/workflows/reuse.yml).
version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2002-2026 Leandro Rabindranath Leon"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "third_party/miniz/**"
precedence = "override"
SPDX-FileCopyrightText = [
  "2013-2014 RAD Game Tools and Valve Software",
  "2010-2014 Rich Geldreich and Tenacious Software LLC",
]
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["gmpfrxx.h", "gmpfrxx.C", "mpfr_mul_d.h", "mpfr_mul_d.c"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2001, 2002, 2003, 2006 Free Software Foundation, Inc.",
  "2007-2008 Jon Wilkening",
  "2002-2026 Leandro Rabindranath Leon",
]
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["ran_array.c", "ran_array.h"]
precedence = "override"
SPDX-FileCopyrightText = [
  "Donald E. Knuth",
  "2002-2026 Leandro Rabindranath Leon",
]
SPDX-License-Identifier = "LicenseRef-Knuth-rng"
