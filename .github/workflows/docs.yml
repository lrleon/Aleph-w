name: Docs (Doxygen)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: build-and-deploy (GitHub Pages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build Doxygen HTML
        run: |
          rm -rf docs/html
          # The site carries the version of VERSION.txt, which each release sets:
          # with "-", Doxygen reads its configuration from the standard input and
          # keeps the last value of an option. The empty echo ends the last line
          # of the Doxyfile, in case it has no newline
          version=$(tr -d "[:space:]" < VERSION.txt)
          ( cat Doxyfile; echo; echo "PROJECT_NUMBER = \"${version}\"" ) | doxygen -
          test -f docs/html/index.html
          grep -Eq "id=\"projectnumber\">[^<]*${version//./\\.}<" docs/html/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
