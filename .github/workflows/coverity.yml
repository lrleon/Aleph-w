name: Coverity Scan

on:
  # Manual trigger - can select any branch from GitHub Actions UI
  workflow_dispatch:
  # Optional trigger for Pull Requests via label
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  coverity:
    name: Coverity Static Analysis
    # Only run if manually triggered or if the 'run-coverity' label was added to a PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-coverity')
    runs-on: ubuntu-24.04
    
    env:
      COVERITY_PROJECT: lrleon/Aleph-w
      COVERITY_PROJECT_ID: 13802
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config jq \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      # The build of the tests and the examples, and the capture of Coverity,
      # need more disk than the runner leaves free
      - name: Free disk space
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Download Coverity Build Tool
        run: |
          echo "Downloading Coverity Build Tool..."
          curl -fsS -o cov-analysis.tar.gz \
            --form token=${{ secrets.COVERITY_SCAN_TOKEN }} \
            --form project=${{ env.COVERITY_PROJECT }} \
            https://scan.coverity.com/download/cxx/linux64
          
          # Validate that the downloaded file is a readable gzip tar archive
          tar tzf cov-analysis.tar.gz > /dev/null
          
          mkdir -p cov-analysis
          tar --extract --gzip \
              --file=cov-analysis.tar.gz \
              --directory=cov-analysis \
              --strip-components=1 \
              --no-same-owner \
              --no-same-permissions
          echo "${{ github.workspace }}/cov-analysis/bin" >> $GITHUB_PATH

      # With the tests and the examples, which instantiate the templates of
      # the headers: the library alone compiles its 19 .C files, and Coverity
      # analyzes only the templates that they use
      - name: Configure project
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON

      # Four jobs at a time: each runs the compiler and cov-emit, and the
      # runner has 16 GB
      - name: Build with Coverity
        run: |
          echo "Running Coverity build analysis..."
          cov-build --dir cov-int cmake --build build --parallel 4

          # Show capture summary (do not fail if log file is missing)
          tail -20 cov-int/build-log.txt || true

      - name: Package results
        run: |
          echo "Packaging Coverity results..."
          du -sh build cov-int
          tar czf aleph-w-coverity.tgz cov-int
          ls -lh aleph-w-coverity.tgz
          df -h .

      # Through a cloud upload URL, as the Submit Build page of the project
      # says for builds of more than 500 MB, the limit of the upload to
      # builds?project=, which the capture of the tests and the examples can
      # pass. The response, with that URL, is not printed.
      - name: Submit to Coverity Scan
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
          VERSION: ${{ github.ref_name }}@${{ github.sha }}
          DESCRIPTION: GitHub Actions build from branch ${{ github.ref_name }} (commit ${{ github.sha }})
        run: |
          echo "Submitting to Coverity Scan..."
          SCAN="https://scan.coverity.com/projects/$COVERITY_PROJECT_ID/builds"
          curl -fsS -X POST -o response \
            --data-urlencode "version=$VERSION" \
            --data-urlencode "description=$DESCRIPTION" \
            --data-urlencode "email=$EMAIL" \
            --data-urlencode "token=$TOKEN" \
            --data-urlencode "file_name=aleph-w-coverity.tgz" \
            "$SCAN/init"
          upload_url=$(jq -er '.url' response)
          build_id=$(jq -er '.build_id' response)
          curl -fsS -X PUT --header 'Content-Type: application/json' \
            --upload-file aleph-w-coverity.tgz "$upload_url"
          curl -fsS -X PUT --data-urlencode "token=$TOKEN" "$SCAN/$build_id/enqueue"

          echo ""
          echo "✅ Build $build_id submitted successfully!"
          echo "📊 View results at: https://scan.coverity.com/projects/lrleon-aleph-w"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverity-build-log
          path: |
            cov-int/build-log.txt
            cov-int/emit/*/emit-db.write-log
          retention-days: 7

