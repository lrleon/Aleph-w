name: Release & Packaging

# Roadmap Phase 21. Responsibilities:
#   * find-package-test  — proves an installed Aleph-w is consumable through
#                          find_package, and the sources through
#                          add_subdirectory, by a consumer that chooses no C++
#                          standard (runs on PRs touching packaging too).
#   * installed-package-check — checks the installed package from an external
#                          consumer: identity, sanitizer configuration and
#                          every installed header (same triggers).
#   * packages           — package-release.yml without the upload: builds the
#                          source tarball plus .deb and .rpm on Ubuntu 22.04,
#                          installs the .deb on clean Ubuntu 22.04, 24.04 and
#                          26.04 and Debian 12 and 13, and builds the consumer,
#                          a C program and consumer/package-check against it.
#   * publish            — attaches every artifact to a GitHub release on a tag.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'consumer/**'
      - 'VERSION.txt'
      - 'scripts/installed_package_check.sh'
      - 'scripts/install_header_closure_check.rb'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # find_package consumability — fast, runs on every triggering event.
  # ---------------------------------------------------------------------------
  find-package-test:
    name: find-package-test (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libgmp-dev libmpfr-dev libgsl-dev libx11-dev libpthread-stubs0-dev

      - name: Configure and build the library
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/_install"
          cmake --build build --target Aleph --parallel

      - name: Install to a private prefix
        run: cmake --install build

      - name: Build and run the consumer via find_package
        run: |
          cmake -S consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install"
          cmake --build build-consumer
          ./build-consumer/gol_consumer

      - name: Build and run the consumer with add_subdirectory
        run: |
          cmake -S consumer -B build-consumer-subdirectory -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DALEPH_SOURCE_DIR="${{ github.workspace }}"
          cmake --build build-consumer-subdirectory
          ./build-consumer-subdirectory/gol_consumer

  # ---------------------------------------------------------------------------
  # Installed-package check — the package as an external consumer sees it,
  # plain and with sanitizers: its identity (release number, source revision,
  # sanitizer configuration), the instrumentation and the MemArray annotations
  # that Aleph::Aleph publishes, and every installed header compiled by itself
  # with the installation as the only source of Aleph headers. No other job
  # depends on it.
  # ---------------------------------------------------------------------------
  installed-package-check:
    name: installed-package-check (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ ruby \
            libgmp-dev libmpfr-dev libgsl-dev libx11-dev libpthread-stubs0-dev

      - name: Every top-level header is installed or explicitly excluded
        run: ruby scripts/install_header_closure_check.rb --repo .

      - name: Check the installed package, plain and with sanitizers
        run: |
          scripts/installed_package_check.sh \
            --work "${{ runner.temp }}/aleph-package-check"

  # ---------------------------------------------------------------------------
  # Source tarball + binary packages, and the .deb installed and tested on
  # several distributions — only on a tag or manual dispatch. The same jobs
  # that release-please runs, in package-release.yml, without the upload.
  # ---------------------------------------------------------------------------
  packages:
    name: packages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/package-release.yml
    with:
      tag: ${{ github.ref_name }}
      upload: false

  # ---------------------------------------------------------------------------
  # Publish the GitHub release with every artifact (tags only).
  # ---------------------------------------------------------------------------
  publish:
    name: publish-release
    runs-on: ubuntu-24.04
    needs: packages
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: aleph-w-packages
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release for ${GITHUB_REF_NAME}. See CHANGELOG.md for details." \
            --verify-tag