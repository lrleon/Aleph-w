name: CI

on:
  # A push runs the jobs only on master: a pull request runs them on its own
  # event, and a push to its branch ran them a second time, in another group
  # of concurrency, which took the runners and kept the jobs of the pull
  # request waiting. A branch without a pull request runs them by hand.
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-checks:
    name: policy-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install policy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full doxygen

      - name: License + tests policy (changed headers)
        run: |
          ruby scripts/ci_policy_checks.rb

      - name: Doxygen warnings gate (changed files)
        run: |
          ruby scripts/ci_doxygen_changed.rb

      - name: Header docstring coverage gate (changed public declarations)
        env:
          HEADER_DOC_COVERAGE_MIN: "80"
        run: |
          ruby scripts/test_ci_header_doc_coverage.rb
          ruby scripts/ci_header_doc_coverage.rb \
            --min "${HEADER_DOC_COVERAGE_MIN}"

  # Whether the local CI already passed the required Linux jobs on what
  # this pull request merges (docs/ci-local.md). scripts/ci-local.sh
  # --merge --publish posts on the head of the pull request the status
  # ci-local/required, with the fingerprint of this workflow and of the
  # script, the master of the merge and the week of its images; then the
  # build-and-test jobs and sanitizers skip their steps and pass, which
  # keeps the required checks of master. Only on a pull request of this
  # repository with the label ci-local, for a status that a trusted user
  # posted (CI_LOCAL_TRUSTED, by default the owner of the repository) and
  # that matches this merge. The job waits for it up to
  # CI_LOCAL_WAIT_MINUTES (default 20); otherwise, or on any error, those
  # jobs run here.
  local-ci:
    name: local-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      verified: ${{ steps.gate.outputs.verified }}

    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - name: Look for the status of the local CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED: ${{ vars.CI_LOCAL_TRUSTED || github.repository_owner }}
          WAIT_MINUTES: ${{ vars.CI_LOCAL_WAIT_MINUTES || '20' }}
        run: |
          # It never fails: on any doubt the required Linux jobs run here
          set -u
          verified=false
          tmp="${RUNNER_TEMP:-/tmp}"
          finish() {
            echo "verified=${verified}" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${EVENT}" != pull_request ]; then
            echo "Not a pull request: the required Linux jobs run here."
            finish
          fi
          if [ "${HEAD_REPO}" != "${REPO}" ]; then
            echo "A pull request from another repository: the required Linux jobs run here."
            finish
          fi
          if ! gh api "repos/${REPO}/pulls/${PR}" > "${tmp}/pr.json" 2> /dev/null ||
             ! jq -e '.labels | map(.name) | index("ci-local")' "${tmp}/pr.json" > /dev/null; then
            echo "No label ci-local: the required Linux jobs run here."
            finish
          fi
          # The fingerprint that scripts/ci-local.sh computes on the merge
          fp=$(cat .github/workflows/ci.yml scripts/ci-local.sh | sha256sum | cut -c1-12)
          want="fp=${fp} base=${BASE_SHA:0:12} "
          echo "Waiting up to ${WAIT_MINUTES} minutes for ci-local/required \"${want}...\" on ${HEAD_SHA}"
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            if gh api "repos/${REPO}/commits/${HEAD_SHA}/statuses?per_page=100" > "${tmp}/statuses.json" 2> /dev/null; then
              state="" creator="" desc=""
              IFS=$'\t' read -r state creator desc < <(jq -r '
                [.[] | select(.context == "ci-local/required")][0]
                | if . == null then "" else [.state, .creator.login, .description] | join("\t") end' "${tmp}/statuses.json") || true
              if [ "${state}" = success ] && [[ ",${TRUSTED}," == *",${creator},"* ]] &&
                 [[ "${desc} " == "${want}"* ]]; then
                echo "The local CI of ${creator} passed on this merge: ${desc}"
                verified=true
                finish
              fi
              if [ -n "${state}" ]; then
                echo "Not for this merge yet: ${state} by ${creator}: ${desc}"
              fi
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "No status of the local CI for this merge: the required Linux jobs run here."
              finish
            fi
            sleep 30
          done

  build-and-test:
    name: build-and-test (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }})
    needs: local-ci
    # Also when local-ci failed: its output is then empty, and the
    # steps run
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Passed in the local CI
        if: needs.local-ci.outputs.verified == 'true'
        run: |
          echo "scripts/ci-local.sh --merge --publish ran this job on this merge;"
          echo "the job local-ci found its status (docs/ci-local.md)."

      - name: Checkout
        if: needs.local-ci.outputs.verified != 'true'
        uses: actions/checkout@v7

      - name: Install base system dependencies
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev \
            ruby-full

      - name: Install GCC toolchain
        if: needs.local-ci.outputs.verified != 'true' && matrix.compiler == 'gcc'
        run: |
          sudo apt-get install -y g++

      - name: Install Clang toolchain and libc++
        if: needs.local-ci.outputs.verified != 'true' && matrix.compiler == 'clang'
        run: |
          sudo apt-get install -y clang libc++-dev libc++abi-dev
      - name: Configure compiler
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
            # Use libc++ with Clang for better C++20 std::ranges support
            # Set flags in separate variable to avoid CMake issues
            echo "CXXFLAGS_STDLIB=-stdlib=libc++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
            echo "CXXFLAGS_STDLIB=" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        if: needs.local-ci.outputs.verified != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-ccache-
            ${{ runner.os }}-${{ matrix.os }}-${{ matrix.compiler }}-ccache-
            ${{ runner.os }}-${{ matrix.os }}-ccache-

      - name: Build and install GoogleTest
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          set -euo pipefail

          # For Clang with libc++, we MUST build GoogleTest from source
          # because the system GoogleTest is built with libstdc++ (ABI mismatch)
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "Building GoogleTest from source for Clang + libc++"
            GTEST_SRC=""
            if [ -d /usr/src/googletest ]; then
              GTEST_SRC=/usr/src/googletest
            elif [ -d /usr/src/gtest ]; then
              GTEST_SRC=/usr/src/gtest
            else
              echo "No googletest sources found"
              exit 1
            fi
            
            sudo rm -rf "$GTEST_SRC/build" 2>/dev/null || true
            # Use the configured C and C++ compilers to avoid mixing toolchains
            # Pass libc++ flags only to C++ compiler, not C
            sudo cmake -S "$GTEST_SRC" -B "$GTEST_SRC/build" -G Ninja \
              -DCMAKE_C_COMPILER="${CC}" \
              -DCMAKE_CXX_COMPILER="${CXX}" \
              -DCMAKE_CXX_FLAGS="${CXXFLAGS_STDLIB}" \
              -DCMAKE_EXE_LINKER_FLAGS="-lc++abi"
            sudo cmake --build "$GTEST_SRC/build"
            sudo cmake --install "$GTEST_SRC/build"
            exit 0
          fi

          # For GCC, use system GoogleTest if available
          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"
            exit 0
          fi

          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi

          if [ -d /usr/src/gtest ]; then
            sudo cmake -S /usr/src/gtest -B /usr/src/gtest/build -G Ninja
            sudo cmake --build /usr/src/gtest/build
            sudo cmake --install /usr/src/gtest/build
            exit 0
          fi

          echo "No googletest sources found in /usr/src (expected /usr/src/googletest or /usr/src/gtest)"
          exit 1

      - name: Configure
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          rm -rf build
          # For Clang, add libc++abi to linker flags and stdlib to CXX flags
          EXTRA_LINKER_FLAGS=""
          EXTRA_CXX_FLAGS=""
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            EXTRA_LINKER_FLAGS="-lc++abi"
            EXTRA_CXX_FLAGS="${CXXFLAGS_STDLIB}"
          fi
          # The tests that compile code to check its diagnostics run once
          # per compiler, here; the other jobs of CI leave them out
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="$EXTRA_CXX_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$EXTRA_LINKER_FLAGS" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DALEPH_COMPILE_CHECKS=${{ (matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release') && 'ON' || 'OFF' }}

      - name: Build
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          cmake --build build --parallel

      - name: Test
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          mkdir -p build/test_artifacts/golden_svg
          export ALEPH_TEST_GOLDEN_DIR="$PWD/build/test_artifacts/golden_svg"
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt
            build/test_artifacts/golden_svg

  # Runs the graph benchmarks (benchmarks/graphs). Unlike the cellular-automata
  # anchors of perf-gate.yml, these are not a performance gate: shared runners
  # are too noisy to fail a build on a timing. What fails the job is a wrong
  # answer: every variant is validated against the ground truth of each graph
  # family (a negative cycle must be a closed simple cycle of negative cost,
  # Howard's mean must be Karp's, ...) before it is timed. The timings are
  # published in the job summary and as an artifact for comparison.
  graph-benchmarks:
    name: graph-benchmarks (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-graph-benchmarks-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-graph-benchmarks-ccache-

      - name: Configure
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=ON

      - name: Build
        run: |
          cmake --build build --target graph_benchmarks --parallel

      - name: Validate every variant on every graph family
        # A wrong answer (an invalid witness, a missed or a false detection, a
        # result that is not optimal where that is checked) exits with status 1
        # and fails the job. Only the documented Bellman-Ford defect is counted
        # and tolerated.
        run: |
          set -o pipefail
          ./build/benchmarks/graphs/bench_negative_cycles 300 1 42 --check-only | tee graph-validation.txt

      - name: Time the variants (informational)
        run: |
          set -o pipefail
          {
            ./build/benchmarks/graphs/bench_negative_cycles 300 31 42
            ./build/benchmarks/graphs/bench_negative_cycles 1000 11 42 --only=market-arbitrage
          } | tee graph-benchmarks.txt
          {
            echo '## Graph benchmarks (informational, shared runner)'
            echo
            echo "Validation: $(grep '^Summary' graph-validation.txt)"
            echo
            echo 'Times are informational. A shared runner is typically two to three times slower than a workstation and noisy, so read the ratios between variants, not the absolute values. Only a wrong answer fails the job.'
            echo
            echo '```'
            cat graph-benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: graph-benchmarks
          if-no-files-found: ignore
          path: |
            graph-benchmarks.txt
            graph-validation.txt

  # Guard the C++ standard contract: the library baseline is C++20 (covered by
  # build-and-test above). This job additionally builds and tests the whole
  # library under C++23, so that C++23 consumers stay supported and the
  # std-alias paths of ah-cpp-compat.H (e.g. std::expected) are exercised.
  # ALEPH_SUPPORTED_CXX_STANDARDS is {20, 23}; C++17 is not supported because
  # the library uses concepts throughout.
  cxx23-build:
    name: cxx23-build (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-cxx23-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cxx23-ccache-

      - name: Build and install GoogleTest
        run: |
          set -euo pipefail
          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"; exit 0
          fi
          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi
          echo "No googletest sources found"; exit 1

      - name: Configure (C++23)
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DALEPH_CXX_STANDARD=23 \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          mkdir -p build/test_artifacts/golden_svg
          export ALEPH_TEST_GOLDEN_DIR="$PWD/build/test_artifacts/golden_svg"
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-cxx23
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt

  ranges-off:
    name: ranges-off (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ranges-off-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ranges-off-ccache-

      - name: Build and install GoogleTest
        run: |
          set -euo pipefail
          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"; exit 0
          fi
          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi
          echo "No googletest sources found"; exit 1

      - name: Configure (ranges disabled)
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DALEPH_DISABLE_RANGES=ON \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          mkdir -p build/test_artifacts/golden_svg
          export ALEPH_TEST_GOLDEN_DIR="$PWD/build/test_artifacts/golden_svg"
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-ranges-off
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt

  # Aleph without GSL (ALEPH_WITH_GSL=OFF, the default from 8.0.0), where
  # GSL is not installed: a header or a library of GSL that the library, a
  # test or an example still needed would fail the build
  without-gsl:
    name: without-gsl (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies (no libgsl-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev
          if [ -e /usr/include/gsl/gsl_rng.h ]; then
            echo "The headers of GSL are installed"; exit 1
          fi

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-without-gsl-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-without-gsl-ccache-

      - name: Build and install GoogleTest
        run: |
          set -euo pipefail
          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"; exit 0
          fi
          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi
          echo "No googletest sources found"; exit 1

      - name: Configure (without GSL)
        run: |
          rm -rf build
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DALEPH_WITH_GSL=OFF \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: |
          mkdir -p build/test_artifacts/golden_svg
          export ALEPH_TEST_GOLDEN_DIR="$PWD/build/test_artifacts/golden_svg"
          ctest --test-dir build --output-on-failure --parallel 2 --timeout 600

      # The package passes no GSL to its consumers, and says so
      - name: Check the installed package
        run: |
          set -euo pipefail
          cmake --install build --prefix "$PWD/install"
          cfg=install/lib/cmake/Aleph
          grep -q 'ALEPH_WITH_GSL=0' "$cfg/AlephTargets.cmake"
          if grep -E -q '(^|[;"])gsl(cblas)?([;"]|$)' "$cfg/AlephTargets.cmake"; then
            echo "Aleph::Aleph still passes GSL"; exit 1
          fi
          grep -q 'set(Aleph_WITH_GSL FALSE)' "$cfg/AlephConfig.cmake"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-without-gsl
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeCache.txt

  fft-simd-validation:
    name: fft-simd-validation (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev \
            ruby-full python3-numpy python3-sympy

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-fft-simd-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-fft-simd-ccache-

      - name: Build and install GoogleTest
        run: |
          set -euo pipefail
          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"
            exit 0
          fi
          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi
          if [ -d /usr/src/gtest ]; then
            sudo cmake -S /usr/src/gtest -B /usr/src/gtest/build -G Ninja
            sudo cmake --build /usr/src/gtest/build
            sudo cmake --install /usr/src/gtest/build
            exit 0
          fi
          echo "No googletest sources found in /usr/src (expected /usr/src/googletest or /usr/src/gtest)"
          exit 1

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=ON

      - name: Build test and audit example targets
        run: |
          # Build fft_test (always tracked). Build fft_benchmark and
          # fft_reference_probe / polynomial audit helpers only if their targets
          # are actually present.
          TARGETS="fft_test"
          if [ -f build/build.ninja ]; then
            TARGET_LIST="$(ninja -C build -t targets all 2>/dev/null)"
          else
            TARGET_LIST="$(cmake --build build --target help 2>/dev/null || true)"
          fi
          for t in fft_benchmark fft_reference_probe polynomial_benchmark polynomial_reference_probe; do
            if printf '%s\n' "$TARGET_LIST" | grep -q "^${t}:"; then
              TARGETS="$TARGETS $t"
            fi
          done
          echo "Building targets: $TARGETS"
          cmake --build build --parallel --target $TARGETS

      - name: FFT tests (default SIMD policy)
        run: |
          ctest --test-dir build \
            -R '^(FFT|FFTPlan|FFTLargeN|FFTSTFT|FFTOverlapAdd|FFTND|FFTIIR|FFTDSPUtilities|FFTOverlapSave|FFTPartitionedConvolver)' \
            --output-on-failure --timeout 120

      - name: FFT tests (forced scalar)
        env:
          ALEPH_FFT_SIMD: scalar
        run: |
          ctest --test-dir build \
            -R '^(FFT|FFTPlan|FFTLargeN|FFTSTFT|FFTOverlapAdd|FFTND|FFTIIR|FFTDSPUtilities|FFTOverlapSave|FFTPartitionedConvolver)' \
            --output-on-failure --timeout 120

      - name: FFT tests (forced AVX2)
        env:
          ALEPH_FFT_SIMD: avx2
        run: |
          ctest --test-dir build \
            -R '^(FFT|FFTPlan|FFTLargeN|FFTSTFT|FFTOverlapAdd|FFTND|FFTIIR|FFTDSPUtilities|FFTOverlapSave|FFTPartitionedConvolver)' \
            --output-on-failure --timeout 120

      - name: Benchmark validate and reference cross-check
        run: |
          if [ -x build/Examples/fft_benchmark ]; then
            echo "--- Benchmark validate (scalar) ---"
            ALEPH_FFT_SIMD=scalar ./build/Examples/fft_benchmark --validate
            echo "--- Benchmark validate (AVX2) ---"
            ALEPH_FFT_SIMD=avx2 ./build/Examples/fft_benchmark --validate
          else
            echo "fft_benchmark not available, skipping benchmark validation"
          fi

          if [ -x build/Examples/fft_reference_probe ]; then
            echo "--- Reference cross-check ---"
            ruby scripts/fft_reference_check.rb --build-dir build
          else
            echo "fft_reference_probe not available, skipping reference cross-check"
          fi

          if [ -x build/Examples/polynomial_benchmark ]; then
            echo "--- Polynomial benchmark validate ---"
            ./build/Examples/polynomial_benchmark --validate
          else
            echo "polynomial_benchmark not available, skipping polynomial benchmark validate"
          fi

          if [ -x build/Examples/polynomial_reference_probe ]; then
            echo "--- Polynomial reference cross-check ---"
            ruby scripts/polynomial_reference_check.rb --build-dir build
          else
            echo "polynomial_reference_probe not available, skipping polynomial reference cross-check"
          fi

      - name: Collect benchmark artifacts
        if: always()
        run: |
          if [ ! -x build/Examples/fft_benchmark ]; then
            echo "fft_benchmark not available, skipping artifact collection"
            exit 0
          fi
          mkdir -p build/fft_artifacts
          ALEPH_FFT_SIMD=scalar ./build/Examples/fft_benchmark \
            --json --warmup 3 --samples 5 --batch-count 8 \
            > build/fft_artifacts/benchmark-scalar.json
          ALEPH_FFT_SIMD=avx2 ./build/Examples/fft_benchmark \
            --json --warmup 3 --samples 5 --batch-count 8 \
            > build/fft_artifacts/benchmark-avx2.json
          ALEPH_FFT_SIMD=auto ./build/Examples/fft_benchmark \
            --json --warmup 3 --samples 5 --batch-count 8 \
            > build/fft_artifacts/benchmark-auto.json

      - name: Collect polynomial audit artifacts
        if: always()
        run: |
          if [ ! -x build/Examples/polynomial_benchmark ]; then
            echo "polynomial_benchmark not available, skipping polynomial artifact collection"
            exit 0
          fi
          mkdir -p build/polynomial_artifacts
          ./build/Examples/polynomial_benchmark \
            --json --repetitions 512 --warmup 3 --samples 9 --sizes 64,256,1024 \
            > build/polynomial_artifacts/benchmark-release.json
          cp scripts/fixtures/polynomial_benchmark_release_baseline.json \
            build/polynomial_artifacts/benchmark-release-baseline.json
          if [ -x build/Examples/polynomial_reference_probe ]; then
            ./build/Examples/polynomial_reference_probe --json \
              > build/polynomial_artifacts/reference-probe.json
          fi

      - name: Upload FFT artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fft-simd-benchmarks
          if-no-files-found: ignore
          path: build/fft_artifacts/

      - name: Upload polynomial audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: polynomial-audit-artifacts
          if-no-files-found: ignore
          path: build/polynomial_artifacts/

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-fft-simd
          if-no-files-found: ignore
          path: |
            build/Testing/Temporary/LastTest.log

  planarity-visual-golden:
    name: planarity-visual-golden (ubuntu-24.04, gcc, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            ruby-full \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev

      - name: Configure
        run: |
          rm -rf build-planarity-visual
          cmake -S . -B build-planarity-visual -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EXAMPLES=ON \
            -DBUILD_TESTS=OFF

      - name: Build example
        run: |
          cmake --build build-planarity-visual --target planarity_test_example --parallel

      - name: Generate certificate exchange artifacts
        run: |
          PLANARITY_OUT_DIR="$PWD/build-planarity-visual/planarity_artifacts"
          export PLANARITY_OUT_DIR
          mkdir -p "${PLANARITY_OUT_DIR}"
          ./build-planarity-visual/Examples/planarity_test_example \
            > build-planarity-visual/planarity_example_stdout.txt
          test -f "${PLANARITY_OUT_DIR}/planarity_k33_certificate.graphml"
          test -f "${PLANARITY_OUT_DIR}/planarity_k33_certificate.gexf"

      - name: Visual golden diff
        run: |
          PLANARITY_OUT_DIR="$PWD/build-planarity-visual/planarity_artifacts"
