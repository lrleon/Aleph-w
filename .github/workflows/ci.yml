            build-planarity-visual/planarity_example_stdout.txt
            build-planarity-visual/planarity_visual/report.json
            build-planarity-visual/planarity_visual/renders

  coverage:
    name: coverage (ubuntu-24.04, gcc, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache gcovr ruby-full \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-coverage-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-coverage-ccache-

      - name: Build and install GoogleTest
        run: |
          set -euo pipefail

          if pkg-config --exists gtest gtest_main; then
            echo "gtest found via pkg-config"
            exit 0
          fi

          if [ -d /usr/src/googletest ]; then
            sudo cmake -S /usr/src/googletest -B /usr/src/googletest/build -G Ninja
            sudo cmake --build /usr/src/googletest/build
            sudo cmake --install /usr/src/googletest/build
            exit 0
          fi

          if [ -d /usr/src/gtest ]; then
            sudo cmake -S /usr/src/gtest -B /usr/src/gtest/build -G Ninja
            sudo cmake --build /usr/src/gtest/build
            sudo cmake --install /usr/src/gtest/build
            exit 0
          fi

          echo "No googletest sources found in /usr/src (expected /usr/src/googletest or /usr/src/gtest)"
          exit 1

      - name: Configure
        run: |
          rm -rf build-coverage
          cmake -S . -B build-coverage -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: |
          cmake --build build-coverage --parallel

      - name: Test
        run: |
          mkdir -p build-coverage/test_artifacts/golden_svg
          export ALEPH_TEST_GOLDEN_DIR="$PWD/build-coverage/test_artifacts/golden_svg"
          # Exclude this benchmark from coverage runs because instrumentation
          # changes timing characteristics and can make this test flaky.
          ctest --test-dir build-coverage --output-on-failure --parallel 2 --timeout 600 \
            -E 'ParallelTest\.BenchmarkMapSpeedup'

      - name: Generate coverage reports
        run: |
          ROOT_DIR="$GITHUB_WORKSPACE"
          BUILD_DIR="$ROOT_DIR/build-coverage"
          GCOVR_ARGS=(
            --root "$ROOT_DIR"
            --object-directory "$BUILD_DIR"
            --gcov-exclude "(^|.*/)CMakeFiles/[0-9.]+/CompilerId(C|CXX)/.*"
            --gcov-exclude "(^|.*/)CompilerId(C|CXX)/.*"
            --gcov-ignore-errors source_not_found
            --gcov-ignore-errors no_working_dir_found
            --gcov-ignore-errors output_error
            --gcov-ignore-parse-errors all
            --exclude "(^|.*/)Tests/.*"
            --exclude "(^|.*/)Examples/.*"
            --exclude "(^|.*/)build-coverage/.*"
            --exclude "(^|.*/)cmake-build-.*/.*"
            --exclude "(^|.*/)build-.*/.*"
            --exclude "(^|.*/)CMakeFiles/[0-9.]+/CompilerId(C|CXX)/.*"
          )

          gcovr "${GCOVR_ARGS[@]}" \
            --xml-pretty --output build-coverage/coverage.xml

          gcovr "${GCOVR_ARGS[@]}" \
            --html-details --output build-coverage/coverage.html

          gcovr "${GCOVR_ARGS[@]}" \
            --sort uncovered-percent --print-summary > build-coverage/coverage.txt

          # Phase 27 — per-module coverage for the cellular-automata headers.
          # tpl_ca_*.H (templates/engines) reported separately from ca-*.H
          # (utilities: I/O, observers, exporters, checkpoint).
          gcovr "${GCOVR_ARGS[@]}" \
            --filter '(^|.*/)tpl_ca_.*\.H$' \
            --print-summary > build-coverage/coverage_ca_templates.txt || true
          gcovr "${GCOVR_ARGS[@]}" \
            --filter '(^|.*/)ca-.*\.(H|C)$' \
            --print-summary > build-coverage/coverage_ca_utils.txt || true

      - name: Upload coverage to Codecov
        # Tokenless upload works for public repos via GitHub OIDC. The Codecov
        # project + README badge become live after the first upload reaches
        # codecov.io (one-time maintainer onboarding via "Sign in with GitHub").
        uses: codecov/codecov-action@v7
        with:
          files: build-coverage/coverage.xml
          fail_ci_if_error: false
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Diff coverage gate (PR)
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVERAGE_MIN: "20"
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth here: the checkout above already used fetch-depth: 0
          # (full history). A shallow fetch of the base ref would graft
          # origin/<base_ref> onto a single parentless commit, breaking the
          # three-dot diff's merge-base lookup below as soon as the base
          # branch moves past the PR's fork point.
          git fetch --no-tags --prune origin "${BASE_REF}"
          ruby scripts/ci_diff_coverage.rb \
            --coverage-xml build-coverage/coverage.xml \
            --diff-range "origin/${BASE_REF}...HEAD" \
            --min-line "${DIFF_COVERAGE_MIN}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Publish coverage summary
        run: |
          {
            echo "## Test Coverage"
            echo
            echo '```text'
            cat build-coverage/coverage.txt
            echo '```'
            echo
            echo "### Cellular-automata module (per-header)"
            echo
            echo '#### `tpl_ca_*.H` (templates / engines)'
            echo '```text'
            cat build-coverage/coverage_ca_templates.txt 2>/dev/null || echo "(no data)"
            echo '```'
            echo '#### `ca-*.H` (utilities: I/O, observers, exporters, checkpoint)'
            echo '```text'
            cat build-coverage/coverage_ca_utils.txt 2>/dev/null || echo "(no data)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build-coverage/coverage.xml
            build-coverage/coverage.html
            build-coverage/coverage.txt
            build-coverage/coverage_ca_templates.txt
            build-coverage/coverage_ca_utils.txt

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-coverage
          if-no-files-found: ignore
          path: |
            build-coverage/Testing/Temporary/LastTest.log
            build-coverage/CMakeCache.txt
            build-coverage/test_artifacts/golden_svg

  sanitizers:
    name: sanitizers (ubuntu-24.04, gcc, Debug)
    needs: local-ci
    # Also when local-ci failed: its output is then empty, and the
    # steps run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Passed in the local CI
        if: needs.local-ci.outputs.verified == 'true'
        run: |
          echo "scripts/ci-local.sh --merge --publish ran this job on this merge;"
          echo "the job local-ci found its status (docs/ci-local.md)."

      - name: Checkout
        if: needs.local-ci.outputs.verified != 'true'
        uses: actions/checkout@v7

      - name: Install system dependencies
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            g++ \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        if: needs.local-ci.outputs.verified != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-sanitizers-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sanitizers-ccache-

      - name: Configure
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          rm -rf build-asan
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DALEPH_USE_SANITIZERS=ON

      - name: Build
        if: needs.local-ci.outputs.verified != 'true'
        run: |
          cmake --build build-asan --parallel

      - name: Test
        if: needs.local-ci.outputs.verified != 'true'
        env:
          ASAN_OPTIONS: detect_leaks=1
          ALEPH_TEST_GOLDEN_DIR: ${{ github.workspace }}/build-asan/test_artifacts/golden_svg
        run: |
          mkdir -p "$ALEPH_TEST_GOLDEN_DIR"
          ctest --test-dir build-asan --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-sanitizers
          if-no-files-found: ignore
          path: |
            build-asan/Testing/Temporary/LastTest.log
            build-asan/CMakeCache.txt
            build-asan/test_artifacts/golden_svg

  # The exhaustive tests of the graph algorithms and their contract matrix
  # (Tests/graph_exhaustive_*, Tests/graph_contract_matrix_*) take long to
  # compile, and the other jobs leave them out: here, the oldest compiler
  # and a recent one, in their normal mode, and GCC with ASan and UBSan, in
  # the light mode, whose domains take one arc less. A test of the harness
  # takes up to 3.7 GB to compile in Release, and 5.4 GB under ASan and
  # UBSan, and the runner has 16: three compile at a time in Release and
  # two under the sanitizers, whose exhaustive tests and contract matrix go
  # to two runners.
  graph-harness:
    name: graph harness (${{ matrix.os }}, ${{ matrix.compiler }}, ${{ matrix.build_type }}${{ matrix.sanitizers == 'ON' && ', ASan and UBSan' || '' }}${{ matrix.part != 'all' && format(', {0}', matrix.part) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Release
            sanitizers: 'OFF'
            mode: normal
            part: all
            jobs: 3
          - os: ubuntu-22.04
            compiler: clang
            build_type: Release
            sanitizers: 'OFF'
            mode: normal
            part: all
            jobs: 3
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            sanitizers: 'ON'
            mode: light
            part: exhaustive
            jobs: 2
          - os: ubuntu-24.04
            compiler: gcc
            build_type: Debug
            sanitizers: 'ON'
            mode: light
            part: contract_matrix
            jobs: 2

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The prefixes graph_<suite>_ of the tests that the job builds and runs
      SUITES: ${{ matrix.part == 'all' && 'exhaustive contract_matrix' || matrix.part }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang libc++-dev libc++abi-dev
          else
            sudo apt-get install -y g++
          fi

      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CXXFLAGS_STDLIB=-stdlib=libc++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
            echo "CXXFLAGS_STDLIB=" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-graph-harness-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-${{ matrix.part }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-graph-harness-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}-${{ matrix.part }}-ccache-

      - name: Build and install GoogleTest with libc++
        if: matrix.compiler == 'clang'
        run: |
          set -euo pipefail
          # The GoogleTest of the system is built with libstdc++
          GTEST_SRC=/usr/src/googletest
          [ -d "$GTEST_SRC" ] || GTEST_SRC=/usr/src/gtest
          sudo rm -rf "$GTEST_SRC/build"
          sudo cmake -S "$GTEST_SRC" -B "$GTEST_SRC/build" -G Ninja \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STDLIB}" \
            -DCMAKE_EXE_LINKER_FLAGS="-lc++abi"
          sudo cmake --build "$GTEST_SRC/build"
          sudo cmake --install "$GTEST_SRC/build"

      - name: Configure
        run: |
          EXTRA_LINKER_FLAGS=""
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            EXTRA_LINKER_FLAGS="-lc++abi"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STDLIB}" \
            -DCMAKE_EXE_LINKER_FLAGS="$EXTRA_LINKER_FLAGS" \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DALEPH_USE_SANITIZERS=${{ matrix.sanitizers }} \
            -DALEPH_GRAPH_HARNESS_TESTS=ON

      - name: Build the harness
        run: |
          targets=$(for suite in $SUITES; do ls Tests/graph_${suite}_*_test.cc; done | xargs -n1 basename | sed 's/\.cc$//')
          cmake --build build --parallel ${{ matrix.jobs }} --target $targets

      - name: Run the harness
        env:
          ALEPH_GRAPH_HARNESS: ${{ matrix.mode }}
          ASAN_OPTIONS: detect_leaks=1
        run: |
          status=0
          for suite in $SUITES; do
            for test in build/Tests/graph_${suite}_*_test; do
              echo "::group::$(basename "$test")"
              "$test" --gtest_brief=1 || status=1
              echo "::endgroup::"
            done
          done
          exit $status

  memory-sanitizer:
    name: memory-sanitizer (ubuntu-24.04, clang, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config cppcheck \
            clang \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev

      - name: Check Regular_Polygon member initialization
        run: |
          cppcheck \
            --enable=warning \
            --std=c++20 \
            --language=c++ \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --inline-suppr \
            polygon.H

      - name: Configure targeted MemorySanitizer probe
        run: |
          cmake -S . -B build-msan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DALEPH_BUILD_X11_VIEWER=OFF \
            -DALEPH_USE_MEMORY_SANITIZER=ON

      - name: Build targeted MemorySanitizer probe
        run: |
          cmake --build build-msan \
            --target regular_polygon_msan_probe \
            --parallel

      - name: Test default Regular_Polygon state
        run: |
          ctest --test-dir build-msan --output-on-failure \
            -R '^MemorySanitizer\.RegularPolygonDefaultState$'

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-memory-sanitizer
          if-no-files-found: ignore
          path: |
            build-msan/Testing/Temporary/LastTest.log
            build-msan/CMakeCache.txt

  tsan:
    # Phase 16 — sanitizer matrix expansion.
    # ThreadSanitizer focuses on data races in the CA Parallel_Engine and
    # thread_pool surfaces. It runs every test it builds; the few cases that
    # cannot run under TSan skip themselves (see docs/ci_sanitizer_policy.md).
    name: tsan (ubuntu-24.04, clang, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            clang \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-tsan-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-tsan-ccache-

      - name: Configure
        run: |
          rm -rf build-tsan
          cmake -S . -B build-tsan -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: |
          cmake --build build-tsan --parallel

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
          ALEPH_TEST_GOLDEN_DIR: ${{ github.workspace }}/build-tsan/test_artifacts/golden_svg
        run: |
          mkdir -p "$ALEPH_TEST_GOLDEN_DIR"
          ctest --test-dir build-tsan --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-tsan
          if-no-files-found: ignore
          path: |
            build-tsan/Testing/Temporary/LastTest.log
            build-tsan/CMakeCache.txt
            build-tsan/test_artifacts/golden_svg

  ubsan:
    # Phase 16 — UndefinedBehaviorSanitizer split from the combined
    # ASan+UBSan build so signals are not masked by ASan reports.
    # Excluded tests are documented in docs/ci_sanitizer_policy.md.
    name: ubsan (ubuntu-24.04, clang, Debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            clang \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            libgtest-dev

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ubsan-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ubsan-ccache-

      - name: Configure
        run: |
          rm -rf build-ubsan
          # We pin every UBSan check including the noisy ones (vptr requires
          # RTTI; nullability is whole-program). halt_on_error is set in the
          # environment so any signal turns the job red.
          cmake -S . -B build-ubsan -G Ninja \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build
        run: |
          cmake --build build-ubsan --parallel

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ALEPH_TEST_GOLDEN_DIR: ${{ github.workspace }}/build-ubsan/test_artifacts/golden_svg
        run: |
          mkdir -p "$ALEPH_TEST_GOLDEN_DIR"
          ctest --test-dir build-ubsan --output-on-failure --parallel 2 --timeout 600

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-ubsan
          if-no-files-found: ignore
          path: |
            build-ubsan/Testing/Temporary/LastTest.log
            build-ubsan/CMakeCache.txt
            build-ubsan/test_artifacts/golden_svg

  check-examples:
    name: check-examples (ubuntu-24.04, ${{ matrix.compiler }}, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config ccache \
            libgmp-dev libmpfr-dev libgsl-dev \
            libx11-dev libpthread-stubs0-dev \
            libtclap-dev \
            ruby-full

      - name: Install GCC toolchain
        if: matrix.compiler == 'gcc'
        run: sudo apt-get install -y g++

      - name: Install Clang toolchain
        if: matrix.compiler == 'clang'
        run: sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CXXFLAGS_STDLIB=-stdlib=libc++" >> "$GITHUB_ENV"
            echo "LDFLAGS=-lc++abi" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
            echo "CXXFLAGS_STDLIB=" >> "$GITHUB_ENV"
            echo "LDFLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-examples-${{ matrix.compiler }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-examples-${{ matrix.compiler }}-ccache-

      - name: Check examples compilation
        run: |
          ruby scripts/check_examples_compile --verbose --jobs "$(nproc)" \
            --build-dir "build-examples-${{ matrix.compiler }}"

      - name: TSAN smoke pass for concurrency examples
        run: |
          # Build a selected set of concurrency-heavy examples with TSAN
          ruby scripts/check_examples_compile --verbose --jobs "$(nproc)" --tsan \
            --build-dir "build-examples-${{ matrix.compiler }}-tsan"

      - name: Upload examples build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: examples-build-log-${{ matrix.compiler }}
          path: build-examples-${{ matrix.compiler }}/examples_build.log

      - name: Upload TSAN examples build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: examples-build-log-${{ matrix.compiler }}-tsan
          path: build-examples-${{ matrix.compiler }}-tsan/examples_build.log

  ci-success-push:
    name: CI Success
    runs-on: ubuntu-24.04
    needs:
      - build-and-test
      - fft-simd-validation
      - planarity-visual-golden
      - coverage
      - sanitizers
      - graph-harness
      - memory-sanitizer
      - tsan
      - ubsan
      - check-examples
      - without-gsl
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "build-and-test result: ${{ needs.build-and-test.result }}"
          echo "fft-simd-validation result: ${{ needs.fft-simd-validation.result }}"
          echo "planarity-visual-golden result: ${{ needs.planarity-visual-golden.result }}"
          echo "coverage result: ${{ needs.coverage.result }}"
          echo "sanitizers result: ${{ needs.sanitizers.result }}"
          echo "graph-harness result: ${{ needs.graph-harness.result }}"
          echo "memory-sanitizer result: ${{ needs.memory-sanitizer.result }}"
          echo "tsan result: ${{ needs.tsan.result }}"
          echo "ubsan result: ${{ needs.ubsan.result }}"
          echo "check-examples result: ${{ needs.check-examples.result }}"
          echo "without-gsl result: ${{ needs.without-gsl.result }}"

          is_ok() {
            [ "$1" = "success" ] || [ "$1" = "skipped" ]
          }

          all_ok=1

          check_job() {
            job_name="$1"
            job_result="$2"

            if ! is_ok "$job_result"; then
              echo "Job '$job_name' did not succeed (result: $job_result)"
              all_ok=0
            fi
          }

          check_job "build-and-test" "${{ needs.build-and-test.result }}"
          check_job "fft-simd-validation" "${{ needs.fft-simd-validation.result }}"
          check_job "planarity-visual-golden" "${{ needs.planarity-visual-golden.result }}"
          check_job "coverage" "${{ needs.coverage.result }}"
          check_job "sanitizers" "${{ needs.sanitizers.result }}"
          check_job "graph-harness" "${{ needs.graph-harness.result }}"
          check_job "memory-sanitizer" "${{ needs.memory-sanitizer.result }}"
          check_job "tsan" "${{ needs.tsan.result }}"
          check_job "ubsan" "${{ needs.ubsan.result }}"
          check_job "check-examples" "${{ needs.check-examples.result }}"
          check_job "without-gsl" "${{ needs.without-gsl.result }}"

          if [ "$all_ok" -ne 1 ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"

