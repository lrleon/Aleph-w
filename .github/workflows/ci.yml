            --profile portable.ruby-render-svg \
            --profile portable.ruby-render-pdf \
            --render-output-dir "$PWD/build-planarity-visual/planarity_visual/renders" \
            --report "$PWD/build-planarity-visual/planarity_visual/report.json" \
